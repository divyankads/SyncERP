services:
  # ─── Backend API (MongoDB Production) ───────────────────────────────────────
  - type: web
    name: syncerp-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        value: mongodb+srv://divi:qwe123@ver1.izmmvap.mongodb.net/syncerp?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 8h
      - key: CORS_ORIGIN
        value: https://syncerp.vercel.app
